name: Build LUNA Neural APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check project ZIP
        run: |
          test -f LUNA-Genuine-Neural-Luna-GitHub-Ready.zip

      - name: Extract LUNA project
        run: |
          unzip -q LUNA-Genuine-Neural-Luna-GitHub-Ready.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare genuine neural Luna model
        working-directory: project
        run: |
          sed -i 's#releases/download/v${VERSION}/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2#releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2#' scripts/prepare_luna_neural_kws.sh
          bash scripts/prepare_luna_neural_kws.sh

      - name: Verify neural assets
        working-directory: project
        run: |
          test -s app/src/main/assets/luna_kws/encoder.int8.onnx
          test -s app/src/main/assets/luna_kws/decoder.int8.onnx
          test -s app/src/main/assets/luna_kws/joiner.int8.onnx
          test -s app/src/main/assets/luna_kws/tokens.txt
          test -s app/src/main/assets/luna_kws/keywords.txt
          test -s app/libs/sherpa-onnx-1.13.8.aar

      - name: Build debug APK
        working-directory: project
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: project
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-neural-wake-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
